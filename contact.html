<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Get in touch with Yucean — WeChat, phone and email." />
    <title>Contact — Yucean Design</title>
    <link rel="stylesheet" href="./page-transition.css?v=20261028-2" />
    <script src="./page-transition-boot.js?v=20261028-fast-3"></script>
    <script src="./page-transition.js?v=20261028-fast-3" defer></script>
    <link rel="stylesheet" href="./styles.css?v=20260924-253" />
    <link rel="stylesheet" href="./contact.css?v=20261028-contact-2" />
    <script src="./contact.js?v=20261028-contact-1" defer></script>
  </head>
  <body class="contact-body">
    <div class="contact-page">
      <header class="contact-topbar" aria-label="Main navigation">
        <a class="brand contact-brand" href="./index.html#top" aria-label="Yucean Design home">
          <span class="contact-brand-icon"><img src="./assets/contact/brand-mark.svg" width="26" height="20" alt="" /></span>
          <span>Yucean Design</span>
        </a>
        <nav class="nav-actions" aria-label="Page navigation">
          <a class="button button-dark" href="./assets/resume/yuqiang-resume.pdf" data-resume-picker>Download Resume</a>
          <a class="button button-light contact-home" href="./index.html#top">Home</a>
        </nav>
      </header>

      <main class="contact-main" aria-labelledby="contact-title">
        <div class="contact-glows" aria-hidden="true">
          <img class="contact-glow contact-glow-blue" src="./assets/contact/blue-glow.svg" width="774" height="759" alt="" />
          <img class="contact-glow contact-glow-purple" src="./assets/contact/purple-glow.svg" width="874" height="859" alt="" />
        </div>

        <section class="contact-intro" aria-label="WeChat QR code">
          <div class="contact-title-row">
            <h1 id="contact-title"><span>Get in</span><span>Touch.</span></h1>
            <div class="contact-mascot">
              <img src="./assets/contact/mascot.svg" width="137.042" height="105.417" alt="" />
            </div>
          </div>
          <div class="contact-qr">
            <img src="./assets/contact/wechat-source.jpg" width="888" height="1131" alt="Scan to add Yucean on WeChat, ID YuuuQ801" />
          </div>
        </section>

        <div class="contact-details">
          <section class="contact-method">
            <span class="contact-icon contact-icon-wechat" aria-hidden="true"><img src="./assets/contact/contact-icons.png" width="1200" height="600" alt="" /></span>
            <div class="contact-method-copy">
              <h2>Wechat</h2>
              <button class="contact-value" type="button" data-copy-wechat="YuuuQ801" title="Copy WeChat ID">YuuuQ801</button>
            </div>
          </section>
          <section class="contact-method">
            <span class="contact-icon contact-icon-phone" aria-hidden="true"><img src="./assets/contact/contact-icons.png" width="1200" height="600" alt="" /></span>
            <div class="contact-method-copy">
              <h2>Phone Number</h2>
              <a class="contact-value" href="tel:+8613855144373">+86 13855144373</a>
            </div>
          </section>
          <section class="contact-method">
            <span class="contact-icon contact-icon-mail" aria-hidden="true"><img src="./assets/contact/contact-icons.png" width="1200" height="600" alt="" /></span>
            <div class="contact-method-copy">
              <h2>Mail Contact</h2>
              <a class="contact-value" href="mailto:yu2845399005@gmail.com">yu2845399005@gmail.com</a>
            </div>
          </section>
        </div>
      </main>
    </div>
    <p class="contact-status" role="status" aria-live="polite"></p>
  </body>
</html>
